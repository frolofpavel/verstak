name: Release

on:
  # Временный canary-триггер для изолированной ветки Mac M0. Он запускает только
  # mac_m0 job; legacy-сборки и publish на push запрещены условиями ниже.
  push:
    branches:
      - codex/mac-m0-arm64
  # Авто-триггер на тег ОТКЛЮЧЁН: релизы выкатываются ВРУЧНУЮ (dist:win + GitHub
  # REST API, см. memory/verstak-release-process). Этот CI собирал win/linux/mac
  # с --publish never, но Linux-сборка падала на нативных модулях → шквал
  # «Run failed» писем на каждый тег, а publish-джоба конфликтовала бы с ручным
  # релизом. Оставлен ТОЛЬКО ручной запуск (Actions → Run workflow) — на случай,
  # если понадобится кросс-платформенная сборка.
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - mac-m0
          - legacy

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'mac-m0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: ubuntu-22.04
            platform: linux
            args: --linux --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python (needed for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Linux: системные зависимости для Electron + native modules
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecret-1-dev \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss1 \
            libasound2-dev \
            rpm \
            libarchive-tools \
            build-essential

      # macOS: Xcode command line tools уже установлены на runner
      # Windows: windows-latest уже имеет Visual Studio Build Tools

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -o better-sqlite3,@homebridge/node-pty-prebuilt-multiarch
        env:
          npm_config_python: python3

      - name: Type check
        run: npm run type

      - name: Build renderer + main
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release artifacts
        shell: bash
        run: ls -la release/ 2>/dev/null || echo "no release dir"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verstak-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/latest*.yaml
          if-no-files-found: warn

  mac_m0:
    if: github.event_name == 'push' || inputs.target != 'legacy'
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Apple Silicon host
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (needed for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Mojibake gate
        run: npm run check:mojibake

      - name: Full lint gate
        run: npm run lint:full

      - name: Type gate
        run: npm run type

      - name: Fast test gate with completeness report
        continue-on-error: true
        run: npm run test:fast -- --maxWorkers=4 --reporter=json --outputFile=release/mac-test-report.json

      - name: Verify test completeness
        run: node scripts/check-test-report.mjs release/mac-test-report.json

      - name: Build gate
        run: npm run build

      - name: Performance gate
        run: npm run check:performance

      - name: Diff whitespace gate
        run: git diff --check origin/main...HEAD

      - name: Build unsigned Mac M0 DMG and ZIP
        run: npm run dist:mac

      - name: Run packaged Mac M0 user smoke
        run: npm run smoke:mac:m0

      - name: Upload Mac M0 canary and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verstak-mac-m0-arm64
          path: |
            release/*-mac-arm64.dmg
            release/*-mac-arm64.zip
            release/mac-m0-smoke.json
            release/mac-test-report.json
          if-no-files-found: error

  publish:
    needs: [build, mac_m0]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.mac_m0.result == 'success'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List all artifacts
        run: find dist -type f 2>/dev/null || echo "empty"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
